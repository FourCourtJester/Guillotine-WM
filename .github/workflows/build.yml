name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a release with this version, e.g. 0.1.0 (creates tag v0.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      # Two flavours of each exe:
      #   all-in-one  bundles .NET, nothing to install (large)
      #   lean        needs the .NET 8 Desktop Runtime installed (small)
      - name: Publish
        shell: pwsh
        run: |
          $flavours = @{
            'all-in-one' = @('--self-contained', 'true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true')
            'lean'       = @('--self-contained', 'false')
          }
          foreach ($flavour in $flavours.Keys) {
            foreach ($project in 'src/Guillotine.App', 'src/Guillotine.Cli') {
              dotnet publish $project -c Release -r win-x64 -p:PublishSingleFile=true -p:DebugType=none `
                @($flavours[$flavour]) -o "publish/$flavour"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Copy-Item README.md, LICENSE "publish/$flavour/"
          }
          Get-ChildItem publish -Recurse -File | Format-Table FullName, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      # Opens a plain window and runs the published CLI against it, so the Win32 code
      # is exercised on a real Windows desktop on every push.
      - name: Smoke test window placement
        shell: pwsh
        timeout-minutes: 3
        run: |
          $title = 'Guillotine smoke test'
          $script = "Add-Type -AssemblyName System.Windows.Forms; " +
                    "`$f = New-Object System.Windows.Forms.Form; `$f.Text = '$title'; `$f.Width = 500; `$f.Height = 400; " +
                    "[System.Windows.Forms.Application]::Run(`$f)"
          $form = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', $script

          # A second window that caps its own size (like a game that will not grow past the taskbar).
          $capped = 'Guillotine capped test'
          $cappedScript = "Add-Type -AssemblyName System.Windows.Forms; " +
                          "`$f = New-Object System.Windows.Forms.Form; `$f.Text = '$capped'; " +
                          "`$f.MaximumSize = New-Object System.Drawing.Size(400, 300); " +
                          "[System.Windows.Forms.Application]::Run(`$f)"
          $cappedForm = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', $cappedScript

          # A window that resizes itself straight back to 400x300 whenever it is resized (like Heroes).
          $stubborn = 'Guillotine stubborn test'
          $stubbornScript = "Add-Type -AssemblyName System.Windows.Forms; " +
                            "`$f = New-Object System.Windows.Forms.Form; `$f.Text = '$stubborn'; " +
                            "`$size = New-Object System.Drawing.Size(400, 300); `$f.ClientSize = `$size; " +
                            "`$f.Add_Resize({ if (`$f.ClientSize -ne `$size) { `$f.ClientSize = `$size } }); " +
                            "[System.Windows.Forms.Application]::Run(`$f)"
          $stubbornForm = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', $stubbornScript

          # A decoy whose title only contains the target title (like a terminal showing the command line).
          # Started last so it is in front; the exact title must still win.
          Start-Sleep -Seconds 6
          $decoyScript = "Add-Type -AssemblyName System.Windows.Forms; " +
                         "`$f = New-Object System.Windows.Forms.Form; `$f.Text = 'Notes about $title'; " +
                         "[System.Windows.Forms.Application]::Run(`$f)"
          $decoyForm = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', $decoyScript
          try {
            foreach ($flavour in 'all-in-one', 'lean') {
              Write-Host "--- $flavour"
              $cli = "./publish/$flavour/guillotine-cli.exe"
              function Invoke-Cli { & $cli @args; if ($LASTEXITCODE -ne 0) { throw "$cli $args exited with $LASTEXITCODE" } }

              Invoke-Cli monitors
              $output = Invoke-Cli apply --title $title --wait --size 640x480 --zone center --borderless --topmost
              $output
              if (-not ($output -match "powershell: `"$title`"")) { throw 'applied to the wrong window; the exact title should win over the decoy' }
              Invoke-Cli windows
              Invoke-Cli apply --title $title --size 640x480 --zone center --borderless --topmost --hold 1
              Invoke-Cli apply --title $title --size 600x400 --zone top-left --framed --no-topmost
              Invoke-Cli borderless on --title $title
              Invoke-Cli restore --title $title

              # Windows only enforces a window's size limit (WM_GETMINMAXINFO) while it has a resize frame,
              # so keep the frame: the CLI must bypass the 400x300 limit to reach 640x480.
              $output = Invoke-Cli apply --title $capped --wait --size 640x480 --zone center --framed
              $output
              if (-not ($output -match 'size limits were bypassed')) { throw 'expected the capped window to need a forced resize' }
              Invoke-Cli restore --title $capped

              # The stubborn window insists on its own size (WinForms adds the frame it thinks it has, much
              # like Heroes of the Storm), so it should be centred at that size (exit code 2: not the
              # requested size) and then left alone while holding.
              $output = & $cli apply --title $stubborn --wait --size 640x480 --zone center --borderless --hold 2
              $code = $LASTEXITCODE
              $output
              if ($code -ne 2) { throw "expected exit code 2 for a game-chosen size, got $code" }
              if (-not ($output -match 'Placed it in the same zone at that size')) { throw 'expected the game-chosen size to be accepted' }
              $monitor = ($output | Select-String 'Monitor .* (\d+)x(\d+) at \((-?\d+), (-?\d+)\)').Matches[0].Groups
              $actual = ($output | Select-String 'Actual   client (\d+)x(\d+) at \((-?\d+), (-?\d+)\)').Matches[0].Groups
              $w = [int]$actual[1].Value; $h = [int]$actual[2].Value
              $x = [int]$monitor[3].Value + [math]::Floor(([int]$monitor[1].Value - $w) / 2)
              $y = [int]$monitor[4].Value + [math]::Floor(([int]$monitor[2].Value - $h) / 2)
              if ([int]$actual[3].Value -ne $x -or [int]$actual[4].Value -ne $y) { throw "expected ${w}x${h} centred at ($x, $y)" }
              if (-not ($output -match 'corrected 0 time')) { throw 'expected hold to leave the game-chosen size alone' }
              Invoke-Cli restore --title $stubborn
            }
          }
          finally {
            Stop-Process -Id $form.Id -ErrorAction SilentlyContinue
            Stop-Process -Id $cappedForm.Id -ErrorAction SilentlyContinue
            Stop-Process -Id $decoyForm.Id -ErrorAction SilentlyContinue
            Stop-Process -Id $stubbornForm.Id -ErrorAction SilentlyContinue
          }

      # Runs the real app: the flyout must open above the taskbar, the default hotkey must hide and
      # show it, a second launch must not start a second copy, and start-with-Windows must register.
      - name: Smoke test the app
        shell: pwsh
        timeout-minutes: 4
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class Probe {
              delegate bool EnumProc(IntPtr h, IntPtr l);
              [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
              [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
              [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
              [DllImport("user32.dll")] static extern bool GetWindowRect(IntPtr h, out RECT r);
              [DllImport("user32.dll")] static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
              public struct RECT { public int Left, Top, Right, Bottom; }
              // "visible L,T,R,B", "hidden" or "none" for the window titled Guillotine in process pid.
              public static string Flyout(int pid) {
                  string result = "none";
                  EnumWindows((h, l) => {
                      uint p; GetWindowThreadProcessId(h, out p);
                      var title = new StringBuilder(64); GetWindowText(h, title, 64);
                      if (p == pid && title.ToString() == "Guillotine") {
                          RECT r; GetWindowRect(h, out r);
                          result = IsWindowVisible(h) ? "visible " + r.Left + "," + r.Top + "," + r.Right + "," + r.Bottom : "hidden";
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }
              public static void CtrlAltG() {
                  keybd_event(0x11, 0, 0, UIntPtr.Zero); keybd_event(0x12, 0, 0, UIntPtr.Zero);
                  keybd_event(0x47, 0, 0, UIntPtr.Zero); keybd_event(0x47, 0, 2, UIntPtr.Zero);
                  keybd_event(0x12, 0, 2, UIntPtr.Zero); keybd_event(0x11, 0, 2, UIntPtr.Zero);
              }
          }
          "@
          $crashLog = Join-Path $env:LOCALAPPDATA 'Guillotine\crash.log'
          Remove-Item $crashLog -ErrorAction SilentlyContinue

          foreach ($flavour in 'all-in-one', 'lean') {
            Write-Host "--- $flavour"
            $app = Start-Process "./publish/$flavour/Guillotine.exe" -PassThru
            try {
              Start-Sleep -Seconds 6
              if ($app.HasExited) { throw "the app exited with code $($app.ExitCode)" }
              if (Test-Path $crashLog) { Get-Content $crashLog; throw 'the app logged a crash' }

              $state = [Probe]::Flyout($app.Id); Write-Host "flyout: $state"
              if ($state -notlike 'visible *') { throw 'the flyout did not open on launch' }
              $r = $state.Substring(8).Split(',') | ForEach-Object { [int]$_ }
              Add-Type -AssemblyName System.Windows.Forms
              $screen = [System.Windows.Forms.Screen]::PrimaryScreen
              Write-Host "screen $($screen.Bounds), work area $($screen.WorkingArea)"
              if ($r[2] -le $screen.Bounds.Width / 2 -or $r[3] -le $screen.Bounds.Height / 2) { throw 'the flyout is not in the bottom-right corner' }
              if ($r[3] -gt $screen.WorkingArea.Bottom) { throw 'the flyout overlaps the taskbar' }
              if ($r[2] - $r[0] -gt 400) { throw "the flyout is $($r[2] - $r[0]) px wide; expected about 380" }

              [Probe]::CtrlAltG(); Start-Sleep -Seconds 1
              $state = [Probe]::Flyout($app.Id); Write-Host "after hotkey: $state"
              if ($state -ne 'hidden') { throw 'Ctrl+Alt+G did not hide the flyout' }
              [Probe]::CtrlAltG(); Start-Sleep -Seconds 1
              $state = [Probe]::Flyout($app.Id); Write-Host "after hotkey again: $state"
              if ($state -notlike 'visible *') { throw 'Ctrl+Alt+G did not show the flyout' }

              $second = Start-Process "./publish/$flavour/Guillotine.exe" -PassThru
              if (-not $second.WaitForExit(10000)) { $second.Kill(); throw 'a second launch kept running instead of handing over' }
              if ($app.HasExited) { throw 'the first instance exited' }

              $cli = "./publish/$flavour/guillotine-cli.exe"
              & $cli startup on; if ($LASTEXITCODE -ne 0) { throw 'startup on failed' }
              schtasks /Query /TN Guillotine /V /FO LIST | Select-String 'Task To Run|Logon Mode|Run As User'
              if ($LASTEXITCODE -ne 0) { throw 'no scheduled task was created' }
              $status = & $cli startup status; $status
              if ($status -notmatch 'scheduled task') { throw 'startup status does not report the task' }
              & $cli startup off; if ($LASTEXITCODE -ne 0) { throw 'startup off failed' }
              $status = & $cli startup status; $status
              if ($status -notmatch ': off') { throw 'startup is still on' }

              if (Test-Path $crashLog) { Get-Content $crashLog; throw 'the app logged a crash' }
            }
            finally {
              Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 1
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: guillotine-win-x64-all-in-one
          path: publish/all-in-one/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: guillotine-win-x64-lean
          path: publish/lean/
          if-no-files-found: error

  # Runs for a pushed v* tag, or for a manual run with a version (which creates the tag).
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: guillotine-win-x64-*
          path: artifacts

      - name: Zip
        run: |
          for dir in artifacts/*/; do
            flavour=$(basename "$dir" | sed 's/^guillotine-win-x64-//')
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/guillotine-${TAG}-win-x64-${flavour}.zip" .)
          done
          ls -la *.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Guillotine ${{ env.TAG }}
          files: guillotine-*-win-x64-*.zip
          generate_release_notes: true
          body: |
            Two downloads, each with `Guillotine.exe` (the app) and `guillotine-cli.exe` (the command line) for 64-bit Windows 10 or 11:

            - **all-in-one**: .NET is bundled inside; nothing to install.
            - **lean**: much smaller, but needs the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (x64). Windows offers a download link if it is missing.

            Keep `settings.json` next to the exe. See the [README](https://github.com/${{ github.repository }}#readme) for usage.
