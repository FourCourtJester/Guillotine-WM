name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test -c Release

      # Two flavours of each exe:
      #   all-in-one  bundles .NET, nothing to install (large)
      #   lean        needs the .NET 8 Desktop Runtime installed (small)
      - name: Publish
        shell: pwsh
        run: |
          $flavours = @{
            'all-in-one' = @('--self-contained', 'true', '-p:IncludeNativeLibrariesForSelfExtract=true', '-p:EnableCompressionInSingleFile=true')
            'lean'       = @('--self-contained', 'false')
          }
          foreach ($flavour in $flavours.Keys) {
            foreach ($project in 'src/Guillotine.App', 'src/Guillotine.Cli') {
              dotnet publish $project -c Release -r win-x64 -p:PublishSingleFile=true -p:DebugType=none `
                @($flavours[$flavour]) -o "publish/$flavour"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            Copy-Item README.md, LICENSE "publish/$flavour/"
          }
          Get-ChildItem publish -Recurse -File | Format-Table FullName, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      # Opens a plain window and runs the published CLI against it, so the Win32 code
      # is exercised on a real Windows desktop on every push.
      - name: Smoke test window placement
        shell: pwsh
        timeout-minutes: 3
        run: |
          $title = 'Guillotine smoke test'
          $script = "Add-Type -AssemblyName System.Windows.Forms; " +
                    "`$f = New-Object System.Windows.Forms.Form; `$f.Text = '$title'; `$f.Width = 500; `$f.Height = 400; " +
                    "[System.Windows.Forms.Application]::Run(`$f)"
          $form = Start-Process powershell -PassThru -ArgumentList '-NoProfile', '-Command', $script
          try {
            foreach ($flavour in 'all-in-one', 'lean') {
              Write-Host "--- $flavour"
              $cli = "./publish/$flavour/guillotine-cli.exe"
              function Invoke-Cli { & $cli @args; if ($LASTEXITCODE -ne 0) { throw "$cli $args exited with $LASTEXITCODE" } }

              Invoke-Cli monitors
              Invoke-Cli apply --title $title --wait --size 640x480 --zone center --borderless --topmost
              Invoke-Cli windows
              Invoke-Cli apply --title $title --size 600x400 --zone top-left --framed --no-topmost
              Invoke-Cli borderless on --title $title
              Invoke-Cli restore --title $title
            }
          }
          finally {
            Stop-Process -Id $form.Id -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        with:
          name: guillotine-win-x64-all-in-one
          path: publish/all-in-one/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: guillotine-win-x64-lean
          path: publish/lean/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: guillotine-win-x64-*
          path: artifacts

      - name: Zip
        run: |
          for dir in artifacts/*/; do
            flavour=$(basename "$dir" | sed 's/^guillotine-win-x64-//')
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/guillotine-${GITHUB_REF_NAME}-win-x64-${flavour}.zip" .)
          done
          ls -la *.zip

      - uses: softprops/action-gh-release@v3
        with:
          files: guillotine-*-win-x64-*.zip
          generate_release_notes: true
